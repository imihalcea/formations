<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 520" width="1680" height="520">
  <text x="0" y="24" class="accent mono" font-size="22" font-weight="600" letter-spacing="3">CINQ RÈGLES MÉTIER</text>
  <rect x="0" y="50" width="560" height="420" rx="12" class="deck"/>
  <rect x="0" y="50" width="560" height="6" class="accent"/>
  <g class="ink" font-size="28">
    <text x="36" y="120"><tspan class="accent mono" font-weight="600">REG-01</tspan>  durée de 30 min à 4 h</text>
    <text x="36" y="184"><tspan class="accent mono" font-weight="600">REG-02</tspan>  en semaine, de 8h à 20h</text>
    <text x="36" y="248"><tspan class="accent mono" font-weight="600">REG-03</tspan>  2 h de préavis au moins</text>
    <text x="36" y="312"><tspan class="accent mono" font-weight="600">REG-04</tspan>  60 jours à l'avance au plus</text>
    <text x="36" y="376"><tspan class="accent mono" font-weight="600">REG-05</tspan>  aucun chevauchement</text>
  </g>
  <text x="36" y="440" class="ink" font-size="24" opacity="0.6">une page, lue par le développeur</text>

  <text x="840" y="24" class="accent mono" font-size="22" font-weight="600" letter-spacing="3" text-anchor="middle">CE QUE LE DÉVELOPPEUR ÉCRIT</text>
  <rect x="640" y="200" width="400" height="120" rx="12" class="tint"/>
  <rect x="640" y="200" width="400" height="120" rx="12" class="stroke-accent" stroke-width="3" stroke-dasharray="12 10"/>
  <text x="840" y="252" class="ink display" font-size="36" text-anchor="middle">le texte du développeur</text>
  <text x="840" y="294" class="ink" font-size="24" text-anchor="middle" opacity="0.7">quelques lignes, ou une seule</text>
  <path d="M580 260 H630" class="stroke-accent" stroke-width="5"/>
  <path d="M624 247 L642 260 L624 273 Z" class="accent"/>
  <path d="M1050 260 H1100" class="stroke-accent" stroke-width="5"/>
  <path d="M1094 247 L1112 260 L1094 273 Z" class="accent"/>

  <text x="1120" y="24" class="accent mono" font-size="22" font-weight="600" letter-spacing="3">UN AGENT DANS LE TERMINAL</text>
  <rect x="1120" y="50" width="560" height="420" rx="12" class="ink"/>
  <g class="paper mono" font-size="24">
    <text x="1152" y="110" opacity="0.6">$ claude --model claude-sonnet-4-6</text>
    <text x="1152" y="170">&gt; écris validate_booking…</text>
    <text x="1152" y="240" opacity="0.8">● Read docs/regles-metier.md</text>
    <text x="1152" y="290" opacity="0.8">● Write validate_booking.py</text>
    <text x="1152" y="360">def validate_booking(</text>
    <text x="1152" y="396">    booking, resource, now</text>
    <text x="1152" y="432">) -&gt; InvalidBooking | None:</text>
  </g>
  <text x="1680" y="500" class="ink" font-size="24" opacity="0.6" text-anchor="end">Illustration : l'agent lit le dépôt, écrit des fichiers, lance des commandes.</text>
</svg>
