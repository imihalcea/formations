<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 460" width="1680" height="460">
  <path d="M60 120 H1620" class="stroke-muted" stroke-width="6"/>
  <g>
    <circle cx="210" cy="120" r="22" class="muted"/>
    <text x="210" y="70" class="ink mono" font-size="24" font-weight="600" text-anchor="middle">1</text>
    <text x="210" y="190" class="ink display" font-size="30" text-anchor="middle">Complétion de l'IDE</text>
    <text x="210" y="236" class="ink" font-size="26" text-anchor="middle" opacity="0.75">complète un symbole</text>
    <text x="210" y="276" class="ink" font-size="24" text-anchor="middle" opacity="0.55">déterministe, sans modèle</text>
  </g>
  <g>
    <circle cx="630" cy="120" r="22" class="muted"/>
    <text x="630" y="70" class="ink mono" font-size="24" font-weight="600" text-anchor="middle">2</text>
    <text x="630" y="190" class="ink display" font-size="30" text-anchor="middle">Suggestion dans l'éditeur</text>
    <text x="630" y="236" class="ink" font-size="26" text-anchor="middle" opacity="0.75">propose la suite du fichier</text>
    <text x="630" y="276" class="ink" font-size="24" text-anchor="middle" opacity="0.55">GitHub Copilot, 29 juin 2021</text>
  </g>
  <g>
    <circle cx="1050" cy="120" r="22" class="muted"/>
    <text x="1050" y="70" class="ink mono" font-size="24" font-weight="600" text-anchor="middle">3</text>
    <text x="1050" y="190" class="ink display" font-size="30" text-anchor="middle">Assistant conversationnel</text>
    <text x="1050" y="236" class="ink" font-size="26" text-anchor="middle" opacity="0.75">répond dans une fenêtre de dialogue</text>
    <text x="1050" y="276" class="ink" font-size="24" text-anchor="middle" opacity="0.55">ChatGPT, 30 novembre 2022</text>
  </g>
  <g>
    <circle cx="1470" cy="120" r="26" class="accent"/>
    <text x="1470" y="70" class="accent mono" font-size="24" font-weight="600" text-anchor="middle">4</text>
    <text x="1470" y="190" class="accent display" font-size="30" text-anchor="middle">Agent</text>
    <text x="1470" y="236" class="ink" font-size="26" text-anchor="middle" opacity="0.75">agit dans le dépôt</text>
    <text x="1470" y="276" class="ink" font-size="24" text-anchor="middle" opacity="0.55">Claude Code, 24 février 2025</text>
  </g>
  <rect x="60" y="330" width="1560" height="90" rx="12" class="deck"/>
  <text x="840" y="386" class="ink" font-size="28" text-anchor="middle">Les quatre se cumulent dans une journée de travail : aucune ne remplace la précédente.</text>
</svg>
