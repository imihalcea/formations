<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 458" width="1680" height="458">
  <g class="ink" font-size="26">
    <text x="30" y="40" class="accent display" font-size="32">ce que l'agent lit</text>

    <rect x="30" y="62" width="760" height="80" rx="10" class="deck"/>
    <text x="50" y="96" class="mono" font-size="25">bookit/domain/</text>
    <text x="50" y="128" class="mono" font-size="21" opacity="0.8">models.py  ports.py  validate_booking.py</text>
    <rect x="600" y="70" width="180" height="30" rx="15" class="tint"/>
    <text x="690" y="91" class="accent" font-size="18" text-anchor="middle">couche domaine</text>

    <rect x="30" y="156" width="760" height="80" rx="10" class="deck"/>
    <text x="50" y="190" class="mono" font-size="25">bookit/application/</text>
    <text x="50" y="222" class="mono" font-size="21" opacity="0.8">request_booking.py</text>
    <rect x="580" y="164" width="200" height="30" rx="15" class="tint"/>
    <text x="680" y="185" class="accent" font-size="18" text-anchor="middle">couche application</text>

    <rect x="30" y="250" width="760" height="80" rx="10" class="deck"/>
    <text x="50" y="284" class="mono" font-size="25">bookit/infrastructure/</text>
    <text x="50" y="316" class="mono" font-size="21" opacity="0.8">api.py  sqlite_repository.py  system_clock.py</text>
    <rect x="560" y="258" width="220" height="30" rx="15" class="tint"/>
    <text x="670" y="279" class="accent" font-size="18" text-anchor="middle">couche infrastructure</text>

    <rect x="30" y="344" width="760" height="60" rx="10" class="deck"/>
    <text x="50" y="384" class="mono" font-size="25">tests/</text>
    <text x="180" y="384" class="mono" font-size="21" opacity="0.8">conftest.py  test_fumee.py</text>

    <text x="30" y="446" font-size="23" opacity="0.7">couche : un ensemble de modules de même rôle</text>
  </g>

  <g class="ink" font-size="26" opacity="0.5">
    <rect x="880" y="62" width="770" height="342" rx="10" class="stroke-muted" stroke-width="4" stroke-dasharray="16 12"/>
    <text x="900" y="40" class="display" font-size="32">ce que l'équipe sait sans l'avoir écrit</text>
    <text x="910" y="125" font-size="27">« un refus est une valeur, jamais une exception »</text>
    <text x="910" y="205" font-size="27">« le domaine ne lit pas l'horloge »</text>
    <text x="910" y="285" font-size="27">« aucun import d'infrastructure dans le domaine »</text>
    <text x="910" y="365" font-size="27">« et pourquoi ces trois choix »</text>
  </g>
  <text x="900" y="446" class="accent" font-size="23">architecture implicite : invisible pour l'agent, qui ne lit que le dépôt</text>
</svg>
