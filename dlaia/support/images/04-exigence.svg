<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 560" width="1680" height="560">
  <text x="0" y="28" class="accent mono" font-size="22" font-weight="600" letter-spacing="3">REG-03 DEVENUE EXIGENCE</text>
  <rect x="0" y="60" width="1680" height="230" rx="12" class="deck"/>
  <rect x="0" y="60" width="1680" height="6" class="accent"/>
  <g font-size="36" class="ink">
    <text x="48" y="134"><tspan class="accent" font-weight="600">Quand</tspan> une demande commence <tspan class="accent" font-weight="600">moins de 2 heures</tspan> après <tspan font-weight="600" text-decoration="underline">l'instant courant</tspan>,</text>
    <text x="48" y="196">bookit <tspan class="accent" font-weight="600">doit</tspan> la refuser avec le code <tspan class="mono" font-weight="600">lead_time</tspan> ;</text>
    <text x="48" y="258"><tspan class="accent" font-weight="600">2 heures pile est acceptée</tspan>.</text>
  </g>

  <path d="M260 290 V340 M840 290 V340 M1420 290 V340" class="stroke-muted" stroke-width="3"/>

  <g font-size="24" class="ink">
    <rect x="0" y="340" width="520" height="200" rx="12" class="paper"/>
    <rect x="0" y="340" width="520" height="200" rx="12" class="stroke-accent" stroke-width="3"/>
    <text x="32" y="386" class="accent display" font-size="30">borne</text>
    <text x="32" y="430">valeur limite de la règle, incluse ou exclue :</text>
    <text x="32" y="466">« moins de 2 heures » exclut ;</text>
    <text x="32" y="502">« 2 heures pile est acceptée » tranche.</text>

    <rect x="580" y="340" width="520" height="200" rx="12" class="paper"/>
    <rect x="580" y="340" width="520" height="200" rx="12" class="stroke-ink" stroke-width="3"/>
    <text x="612" y="386" class="display" font-size="30">code de refus</text>
    <text x="612" y="430"><tspan class="mono">lead_time</tspan>, un code par règle :</text>
    <text x="612" y="466">la décision nomme la règle enfreinte,</text>
    <text x="612" y="502">le test la compare à une valeur.</text>

    <rect x="1160" y="340" width="520" height="200" rx="12" class="paper"/>
    <rect x="1160" y="340" width="520" height="200" rx="12" class="stroke-ink" stroke-width="3"/>
    <text x="1192" y="386" class="display" font-size="30">instant courant</text>
    <text x="1192" y="430">d'où le préavis se mesure :</text>
    <text x="1192" y="466">fourni en entrée, fixé par le test,</text>
    <text x="1192" y="502">jamais lu sur l'horloge.</text>
  </g>
</svg>
