<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 400" width="1680" height="400">
  <g class="ink" font-size="22">
    <text x="0" y="24" class="accent mono" font-weight="600" letter-spacing="3">FICHIER DE LA COMMANDE</text>
    <rect x="0" y="40" width="520" height="290" rx="12" class="deck"/>
