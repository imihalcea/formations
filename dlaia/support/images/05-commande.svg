    <text x="1460" y="24" class="accent mono" font-weight="600" letter-spacing="3">AGENT</text>
    <rect x="1460" y="110" width="220" height="150" rx="12" class="accent"/>
    <text x="1570" y="170" class="paper display" font-size="28" text-anchor="middle">remplit</text>
