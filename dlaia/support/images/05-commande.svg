    <text x="24" y="84" class="mono" font-size="22">speckit-plan/SKILL.md</text>

    <rect x="24" y="106" width="472" height="56" rx="8" class="ink" opacity="0.85"/>
    <text x="260" y="142" class="paper display" font-size="20" text-anchor="middle">frontmatter : en-tête YAML du fichier</text>

    <rect x="24" y="178" width="472" height="132" rx="8" class="tint"/>
    <text x="48" y="212" class="display" font-size="24">prompt</text>
    <rect x="48" y="228" width="424" height="64" rx="8" class="accent"/>
    <text x="260" y="270" class="paper mono" font-size="28" text-anchor="middle">$ARGUMENTS</text>

    <text x="0" y="372" class="accent" font-size="22">argument : le texte tapé après la commande</text>

    <path d="M524 185 H596" class="stroke-accent" stroke-width="4"/>
    <path d="M594 172 L612 185 L594 198 Z" class="accent"/>

    <text x="620" y="24" class="accent mono" font-weight="600" letter-spacing="3">SCRIPT</text>
    <rect x="620" y="110" width="320" height="150" rx="12" class="deck"/>
    <rect x="620" y="110" width="320" height="6" class="accent"/>
    <text x="780" y="170" class="mono" font-size="22" text-anchor="middle">setup-plan.sh</text>
    <text x="780" y="206" class="mono" font-size="22" text-anchor="middle">--json</text>
    <text x="780" y="240" class="mono" font-size="18" opacity="0.7" text-anchor="middle">.specify/scripts/bash/</text>

    <path d="M944 185 H1016" class="stroke-accent" stroke-width="4"/>
    <path d="M1014 172 L1032 185 L1014 198 Z" class="accent"/>

    <text x="1040" y="24" class="accent mono" font-weight="600" letter-spacing="3">TEMPLATE COPIÉ</text>
    <rect x="1040" y="110" width="320" height="150" rx="12" class="deck"/>
